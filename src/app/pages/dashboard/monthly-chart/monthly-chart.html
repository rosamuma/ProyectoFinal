<div class="card shadow-sm h-100">
  <div class="card-body d-flex flex-column">
    <h5 class="card-title mb-3">Rendimiento Mensual</h5>
    
    <!-- Contenedor del gráfico con tamaño fijo -->
    <div class="chart-wrapper flex-grow-1">
      <canvas baseChart
              [data]="barChartData"
              [options]="barChartOptions"
              [type]="'bar'">
      </canvas>
    </div>
  </div>
</div>
