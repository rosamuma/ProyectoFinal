<div class="card shadow-sm h-100 border-0">
  <div class="card-header bg-white border-0 py-3">
    <h5 class="card-title mb-0 fw-bold text-dark">Rendimiento Mensual</h5>
  </div>
  <div class="card-body d-flex flex-column p-3">
    <div class="chart-wrapper flex-grow-1" style="min-height: 250px;">
      <canvas baseChart
              [data]="barChartData"
              [options]="barChartOptions"
              [type]="'bar'">
      </canvas>
    </div>
  </div>
</div>
