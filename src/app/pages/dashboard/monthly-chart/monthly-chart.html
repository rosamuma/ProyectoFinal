<!-- 
Componente: monthly-chart
Ubicación: /src/app/components/monthly-chart/monthly-chart.component.html
Dependencias: ng2-charts, Chart.js, Bootstrap 5
Breakpoints: Todos (responsive canvas)
-->
<div class="monthly-chart card">
  <div class="card-header">
    <h2 class="card-title">Rendimiento Mensual</h2>
  </div>
  <div class="card-body">
    <div class="chart-container">
      <!-- 
        Nota: Este canvas usa baseChart directive de ng2-charts
        Requiere: BaseChartDirective importado en el componente TypeScript
      -->
      <canvas baseChart
              [data]="barChartData"
              [options]="barChartOptions"
              type="bar">
      </canvas>
    </div>
  </div>
</div>
