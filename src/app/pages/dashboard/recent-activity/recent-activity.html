<!-- 
Componente: recent-activity
Ubicación: /src/app/components/recent-activity/recent-activity.component.html
Dependencias: Bootstrap 5, Datos del DashboardService (recent array)
Breakpoints: Todos (responsive)
-->
<div class="recent-activity card h-100">
  <div class="card-header">
    <h2 class="card-title">Actividad Reciente</h2>
  </div>
  <div class="card-body">
    <div class="activity-list">
      <div *ngFor="let activity of data" class="activity-item" aria-label="Actividad: {{ activity.title }}">
        <div class="activity-content">
          <h3 class="activity-title">{{ activity.title }}</h3>
          <p class="activity-subtitle">{{ activity.subtitle }}</p>
        </div>
        <div class="activity-meta">
          <span class="activity-time">{{ activity.time }}</span>
          <span *ngIf="activity.badge" class="activity-badge" [class]="'badge ' + getBadgeClass(activity.badge)">
            {{ activity.badge }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
