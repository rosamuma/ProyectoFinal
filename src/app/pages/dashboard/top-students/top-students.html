<div class="card mb-4 shadow-sm">
  <div class="card-body">
    <h5 class="card-title">Mejores Estudiantes</h5>
    
    <!-- aquí tu grid de estudiantes -->
    <div class="row g-2 mt-3">
      <div *ngFor="let s of top" class="col-md-4">
        <div class="card text-center p-3 h-100">
          <div class="badge bg-success rounded-circle mb-2 mx-auto" style="width: 30px; height: 30px; line-height: 30px;">
            {{s.place}}
          </div>
          <h6 class="mb-1">{{s.name}}</h6>
          <h3 class="text-primary mb-1">{{s.grade}}</h3>
          <small class="text-muted">{{s.place}}° Puesto</small>
        </div>
      </div>
    </div>
    <!-- fin del grid -->
  </div>
</div>
