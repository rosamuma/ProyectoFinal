<!-- 
Componente: top-students
Ubicación: /src/app/components/top-students/top-students.component.html
Dependencias: Bootstrap 5, Datos del DashboardService (topStudents array)
Breakpoints: Desktop/Laptop (oculto en móviles)
-->
<div class="top-students card">
  <div class="card-header">
    <h2 class="card-title">Mejores Estudiantes</h2>
  </div>
  <div class="card-body">
    <div class="students-list">
      <div *ngFor="let student of top" class="student-item" aria-label="Estudiante {{ student.name }} con calificación {{ student.grade }}">
        <div class="student-rank">
          <span class="rank-badge" [class]="'rank-' + student.place">
            {{ student.place }}
          </span>
        </div>
        <div class="student-info">
          <h3 class="student-name">{{ student.name }}</h3>
          <p class="student-grade">Calificación: {{ student.grade }}/10</p>
        </div>
        <div class="student-medal">
          <i class="fas fa-medal" [style.color]="getMedalColor(student.place)"></i>
        </div>
      </div>
    </div>
  </div>
</div>
