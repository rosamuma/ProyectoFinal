<div class="card shadow-sm border-0 h-100">
  <div class="card-header bg-white border-0 py-3">
    <h5 class="card-title mb-0 fw-bold text-dark">Mejores Estudiantes</h5>
  </div>
  <div class="card-body">
    <div class="row g-3">
      <div *ngFor="let s of top" class="col-sm-6 col-lg-12 col-xl-6">
        <div class="card border-0 bg-light h-100">
          <div class="card-body text-center p-3">
            <div class="badge bg-primary rounded-circle mb-2 mx-auto d-flex align-items-center justify-content-center" 
                 style="width: 40px; height: 40px;">
              <span class="fw-bold">{{s.place}}</span>
            </div>
            <h6 class="fw-bold mb-1 text-dark">{{s.name}}</h6>
            <h3 class="text-primary mb-1 fw-bold">{{s.grade}}</h3>
            <small class="text-muted">{{s.place}}° Puesto - Promedio</small>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
