<!-- 
Componente: progress-subjects
Ubicación: /src/app/components/progress-subjects/progress-subjects.component.html
Dependencias: Bootstrap 5, Datos del DashboardService (progress array)
Breakpoints: Todos (responsive)
-->
<div class="progress-subjects card">
  <div class="card-header">
    <h2 class="card-title">Progreso por Materia</h2>
  </div>
  <div class="card-body">
    <div class="subjects-list">
      <div *ngFor="let subject of data" class="subject-item" aria-label="Progreso de {{ subject.name }}">
        <div class="subject-header">
          <h3 class="subject-name">{{ subject.name }}</h3>
          <span class="student-count">{{ subject.students }} estudiantes</span>
        </div>
        
        <div class="progress-container">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="progress-text">
              {{ subject.completedModules }}/{{ subject.totalModules }} módulos
            </span>
            <span class="progress-percent">
              {{ (subject.completedModules / subject.totalModules * 100) | number:'1.0-0' }}%
            </span>
          </div>
          
          <div class="progress">
            <div class="progress-bar" 
                 role="progressbar" 
                 [style.width.%]="(subject.completedModules / subject.totalModules * 100)"
                 [attr.aria-valuenow]="(subject.completedModules / subject.totalModules * 100)"
                 aria-valuemin="0" 
                 aria-valuemax="100">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
