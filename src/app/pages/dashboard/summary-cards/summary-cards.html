<!-- 
Componente: summary-cards
Ubicación: /src/app/components/summary-cards/summary-cards.component.html
Dependencias: Bootstrap 5, Datos del DashboardService
Breakpoints: Todos (responsive grid)
-->
<div class="summary-cards" aria-label="Resumen de estadísticas">
  <div class="row g-3">
    <!-- Total Estudiantes -->
    <div class="col-xl-3 col-md-6">
      <div class="summary-card card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <h3 class="card-value">{{ data?.totalStudents || 0 }}</h3>
              <p class="card-label">Estudiantes</p>
            </div>
            <div class="card-icon students">
              <i class="fas fa-users"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Total Docentes -->
    <div class="col-xl-3 col-md-6">
      <div class="summary-card card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <h3 class="card-value">{{ data?.totalTeachers || 0 }}</h3>
              <p class="card-label">Docentes</p>
            </div>
            <div class="card-icon teachers">
              <i class="fas fa-chalkboard-teacher"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Total Cursos -->
    <div class="col-xl-3 col-md-6">
      <div class="summary-card card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <h3 class="card-value">{{ data?.totalCourses || 0 }}</h3>
              <p class="card-label">Cursos</p>
            </div>
            <div class="card-icon courses">
              <i class="fas fa-book"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Promedio General -->
    <div class="col-xl-3 col-md-6">
      <div class="summary-card card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <h3 class="card-value">{{ data?.avgGrade || 0 }}</h3>
              <p class="card-label">Promedio General</p>
            </div>
            <div class="card-icon average">
              <i class="fas fa-chart-line"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
