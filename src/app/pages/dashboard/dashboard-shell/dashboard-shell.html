<div class="container-fluid dashboard-container">
  <!-- Header de bienvenida -->
  <div class="row dashboard-grid">
    <div class="col-12">
      <app-welcome-header class="welcome-header" *ngIf="auth.isLogged()"></app-welcome-header>
    </div>

    <!-- Tarjetas resumen - visible para todos los logueados -->
    <div class="col-12">
      <app-summary-cards class="summary-card" *ngIf="auth.isLogged()"></app-summary-cards>
    </div>

    <!-- Primera fila de contenido -->
    <div class="col-xl-8 col-lg-7">
      <div class="row g-3">
        <!-- Progreso por materia -->
        <div class="col-12">
          <app-progress-subjects class="progress-card" *ngIf="auth.isDocente() || auth.isAdmin()"></app-progress-subjects>
        </div>
        <!-- Gráfico mensual -->
        <div class="col-12">
          <app-monthly-chart class="monthly-chart-card" *ngIf="auth.isDocente() || auth.isAdmin()"></app-monthly-chart>
        </div>
      </div>
    </div>

    <!-- Segunda columna - Actividad y mejores estudiantes -->
    <div class="col-xl-4 col-lg-5">
      <div class="row g-3">
        <div class="col-12">
          <app-recent-activity class="activity-card" *ngIf="auth.isDocente() || auth.isAdmin()"></app-recent-activity>
        </div>
        <div class="col-12">
          <app-top-students class="students-card" *ngIf="auth.isAdmin() || auth.isDocente()"></app-top-students>
        </div>
      </div>
    </div>
  </div>
</div>
